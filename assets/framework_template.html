<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#F7F8FA; --card:#FFFFFF; --ink:#1B1F24; --ink2:#576070; --ink3:#8A93A3;
    --line:#E6E8EC; --line2:#D8DCE4; --accent:#2F5BEA; --accent-soft:#EEF2FE;
    --ok:#1E9E6A; --warn:#C98A14; --plot-l:#7C8698;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:34px 30px 60px}
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:6px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:750;margin:0;letter-spacing:-.2px}
  .sub{font-size:12.5px;color:var(--ink2);margin-top:6px}
  .meta{font-size:12px;color:var(--ink3);text-align:right;line-height:1.9}
  .toc{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap}
  .toc a{
    font-size:12px;color:var(--ink2);text-decoration:none;padding:5px 11px;
    border:1px solid var(--line2);border-radius:999px;background:var(--card);
  }
  .toc a:hover{color:var(--accent);border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px 8px;margin-bottom:22px}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
  .sec-h b{font-size:15px;font-weight:700}
  .sec-h span{font-size:12px;color:var(--ink3)}
  .sec-sub{font-size:12px;color:var(--ink2);margin:2px 0 14px;line-height:1.7}
  .sec-sub b{color:var(--ink);font-weight:650}

  .chart{position:relative;width:100%;overflow:hidden}
  .plot{position:relative}
  .col{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.75}
  .col.yr{background:var(--line2);opacity:1}
  .yrlab{position:absolute;top:0;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.4px}
  .monlab{position:absolute;top:18px;font-size:10px;color:#B4BBC7}
  .axl{position:absolute;font-size:11px;color:var(--ink3);white-space:nowrap}
  .axl.k{color:var(--ink2);font-weight:600}
  .axline{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.6}

  .bar{
    position:absolute;height:26px;border-radius:8px;display:flex;align-items:center;
    padding:0 9px;gap:7px;overflow:hidden;cursor:default;
    border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(16,24,40,.05);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .bar .nm{font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:min(58%,300px)}
  .bar .dt{font-size:10.5px;color:rgba(0,0,0,.55);white-space:nowrap;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bar.narrow .nm{flex:1 1 auto;min-width:0;max-width:none}
  .bar.narrow .dt{flex:0 0 auto}
  .bar .sp{font-size:10px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.62);
    color:rgba(0,0,0,.62);white-space:nowrap;flex:0 0 auto}
  .bar .pr{font-size:10.5px;font-weight:700;color:rgba(0,0,0,.66);flex:0 0 auto}
  .bar .star{flex:0 0 auto;font-size:10px;color:#8A5A00;background:rgba(255,255,255,.75);
    border-radius:4px;padding:0 3px;line-height:14px}
  .bar.own{outline:1.5px solid rgba(212,150,20,.55);outline-offset:-1px}
  .bar.todo{opacity:.5;border-style:dashed}
  .bar.clickable{cursor:pointer}
  .bar.clickable:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,24,40,.14);z-index:5}
  .bar.clickable::after{
    content:"查看深挖 →";position:absolute;right:6px;top:-19px;font-size:10px;color:var(--accent);
    background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
    opacity:0;pointer-events:none;transition:opacity .12s;white-space:nowrap;
  }
  .bar.clickable:hover::after{opacity:1}
  .bar .lock{font-size:10px;color:#8A93A3;flex:0 0 auto}

  .foot{margin-top:6px;padding:16px 4px 2px;border-top:1px solid var(--line)}
  .fline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .fline .fk{font-size:11px;color:var(--ink3);min-width:64px}
  .ftag{font-size:11px;padding:2.5px 8px;border-radius:6px;border:1px solid var(--line2);
    background:#fff;color:var(--ink2);line-height:1.5}
  .ftag.ok{color:#166B4B;border-color:#BFE3D3;background:#F1FAF6}
  .ftag.sys{color:#2A4FB0;border-color:#C9D6FB;background:#F3F6FE}
  .ftag.own{color:#8A5A00;border-color:#EBD9A9;background:#FDF8EC}
  .ftag.tip{color:#6B5B8A;border-color:#DCD2EE;background:#F7F4FC}

  /* 弹层 */
  #mask{position:fixed;inset:0;background:rgba(15,20,30,.42);display:none;z-index:80}
  #mask.on{display:block}
  #panel{
    position:fixed;top:4vh;left:50%;transform:translateX(-50%) translateY(8px);
    width:min(940px,92vw);max-height:92vh;background:#fff;border-radius:14px;z-index:81;
    display:none;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(10,16,28,.24);
  }
  #panel.on{display:flex}
  .phd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .phd .t{font-size:14px;font-weight:700;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:6px;flex:0 0 auto}
  .tabs button{
    font-size:11.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--line2);
    background:#fff;color:var(--ink2);cursor:pointer;font-family:inherit;
  }
  .tabs button.on{background:var(--accent-soft);border-color:#C9D6FB;color:#2A4FB0;font-weight:650}
  .px{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);
    background:#fff;color:var(--ink2);cursor:pointer;font-size:16px;line-height:1;font-family:inherit}
  .px:hover{background:#F3F4F7}
  .pbd{padding:6px 26px 30px;overflow:auto;flex:1 1 auto}
  .pbd .md-h1{font-size:19px;font-weight:750;margin:18px 0 8px}
  .pbd .md-h2{font-size:15.5px;font-weight:700;margin:20px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
  .pbd .md-h3{font-size:13.5px;font-weight:700;margin:15px 0 6px;color:#2A3140}
  .pbd .md-h4,.pbd .md-h5,.pbd .md-h6{font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#3A4454}
  .pbd .md-p{margin:7px 0;line-height:1.78;color:#242A33}
  .pbd .md-list{margin:7px 0;padding-left:20px}
  .pbd .md-li{margin:3px 0;line-height:1.75}
  .pbd .md-cb{list-style:none;margin-left:-16px}
  .pbd .md-box{display:inline-flex;width:13px;height:13px;border:1px solid var(--line2);border-radius:3px;
    margin-right:7px;align-items:center;justify-content:center;font-size:9px;color:#fff;vertical-align:-2px}
  .pbd .md-box.on{background:var(--ok);border-color:var(--ok)}
  .pbd .md-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
  .pbd .md-tbl th,.pbd .md-tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .pbd .md-tbl th{background:#F7F8FA;font-weight:650;color:#2A3140}
  .pbd .md-quote{margin:9px 0;padding:8px 12px;border-left:3px solid #C9D6FB;background:#F8FAFF;
    color:#3A4454;border-radius:0 6px 6px 0}
  .pbd .md-hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .pbd .md-pre{background:#F7F8FA;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    overflow:auto;font-size:11.5px;line-height:1.6}
  .pbd code{background:#F1F3F7;border-radius:4px;padding:1px 5px;font-size:11.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .pbd a{color:var(--accent)}
  .pbd strong{font-weight:700}
  @media (max-width:820px){
    .wrap{padding:22px 14px 40px}
    .meta{text-align:left}
    .bar .dt{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <h1>{{TITLE}}</h1>
      <div class="sub">{{SUBTITLE}}</div>
    </div>
    <div class="meta">{{META}}</div>
  </div>

  <div class="toc">
    <a href="#s1">① 整机与硬件</a>
    <a href="#s2">② 软件与平台</a>
    <a href="#s3">③ 字段与口径</a>
  </div>

  <div class="card">
    <div class="sec-h"><b>① 整机与硬件</b><span>纵轴＝价格档 · 横轴＝时间</span></div>
    <div class="sec-sub" id="s1">{{SUB1}}</div>
    <div class="chart" id="chart1"><div class="plot" id="plot1"></div></div>
  </div>

  <div class="card">
    <div class="sec-h"><b>② 软件与平台</b><span>纵轴＝形态分层 · 时间轴与上图对齐</span></div>
    <div class="sec-sub" id="s2">{{SUB2}}</div>
    <div class="chart" id="chart2"><div class="plot" id="plot2"></div></div>
  </div>

  <div class="foot" id="s3">
    {{FOOT}}
  </div>
</div>

<div id="mask"></div>
<div id="panel">
  <div class="phd">
    <div class="t" id="ptitle">文档</div>
    <div class="tabs" id="ptabs"></div>
    <button class="px" id="pclose" aria-label="关闭">×</button>
  </div>
  <div class="pbd" id="pbody"></div>
</div>

<script>
const DOCS = {{DOCS_JSON}};
const MAP  = {{MAP_JSON}};
</script>
<script>
/* ── 轻量 markdown 渲染器（无依赖） ── */
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inl(s){
  return s
    .replace(/`([^`]+)`/g,function(m,c){return '<code>'+c+'</code>';})
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(m,t,u){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';});
}
function md2html(md){
  var lines = md.replace(/\r/g,'').split('\n');
  var out = [], i = 0;
  function isSep(s){return /^\|[\s:\-|]+\|?\s*$/.test(s) && s.indexOf('-')>=0;}
  while(i < lines.length){
    var L = lines[i];
    if(/^```/.test(L)){
      var buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      out.push('<pre class="md-pre">'+escHtml(buf.join('\n'))+'</pre>');
      continue;
    }
    if(/^\|/.test(L) && i+1<lines.length && isSep(lines[i+1])){
      var head = L.replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();});
      i += 2;
      var rows=[];
      while(i<lines.length && /^\|/.test(lines[i])){
        rows.push(lines[i].replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();}));
        i++;
      }
      out.push('<table class="md-tbl"><thead><tr>'+head.map(function(h){return '<th>'+inl(h)+'</th>';}).join('')
        +'</tr></thead><tbody>'+rows.map(function(r){
          return '<tr>'+head.map(function(_,k){return '<td>'+inl(r[k]||'')+'</td>';}).join('')+'</tr>';
        }).join('')+'</tbody></table>');
      continue;
    }
    var h = /^(#{1,6})\s+(.*)$/.exec(L);
    if(h){
      var lv = h[1].length;
      out.push('<h'+(lv+1)+' class="md-h'+lv+'">'+inl(h[2])+'</h'+(lv+1)+'>');
      i++; continue;
    }
    if(/^>\s?/.test(L)){
      var qb=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){qb.push(lines[i].replace(/^>\s?/,''));i++;}
      out.push('<blockquote class="md-quote">'+qb.map(inl).join('<br>')+'</blockquote>');
      continue;
    }
    if(/^\s*---+\s*$/.test(L)){out.push('<hr class="md-hr">');i++;continue;}
    if(/^\s*([-*+]|\d+\.)\s+/.test(L)){
      var ord = /^\s*\d+\.\s+/.test(L);
      var items=[];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        var t = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        i++;
        while(i<lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
          t += ' ' + lines[i].trim(); i++;
        }
        items.push(t);
      }
      var tag = ord?'ol':'ul';
      out.push('<'+tag+' class="md-list">'+items.map(function(t){
        var cb = /^\[([ xX])\]\s*(.*)$/.exec(t);
        if(cb){
          var on = cb[1].toLowerCase()==='x';
          return '<li class="md-li md-cb"><span class="md-box'+(on?' on':'')+'">'+(on?'✓':'')+'</span>'+inl(cb[2])+'</li>';
        }
        return '<li class="md-li">'+inl(t)+'</li>';
      }).join('')+'</'+tag+'>');
      continue;
    }
    if(!L.trim()){i++;continue;}
    var pb=[L]; i++;
    while(i<lines.length && lines[i].trim()
          && !/^(#{1,6}\s|\||>|```|\s*([-*+]|\d+\.)\s|\s*---+\s*$)/.test(lines[i])){
      pb.push(lines[i]); i++;
    }
    out.push('<p class="md-p">'+inl(pb.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* ── 弹层 ── */
var mask=document.getElementById('mask'), panel=document.getElementById('panel');
var ptitle=document.getElementById('ptitle'), ptabs=document.getElementById('ptabs'), pbody=document.getElementById('pbody');
var curKey=null;
function openDoc(key, idx){
  var list = MAP[key];
  if(!list || !list.length) return;
  curKey = key;
  var active = typeof idx==='number' ? idx : 0;
  ptitle.textContent = list[active].l;
  ptabs.innerHTML = list.length>1 ? list.map(function(d,k){
    return '<button data-i="'+k+'" class="'+(k===active?'on':'')+'">'+d.l+'</button>';
  }).join('') : '';
  var md = DOCS[list[active].f];
  pbody.innerHTML = md ? md2html(md) : '<p class="md-p">文档缺失：'+list[active].f+'</p>';
  pbody.scrollTop = 0;
  mask.classList.add('on'); panel.classList.add('on');
  Array.prototype.forEach.call(ptabs.querySelectorAll('button'), function(b){
    b.onclick = function(){ openDoc(curKey, parseInt(b.getAttribute('data-i'),10)); };
  });
}
function closeDoc(){ mask.classList.remove('on'); panel.classList.remove('on'); }
mask.onclick = closeDoc;
document.getElementById('pclose').onclick = closeDoc;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDoc(); });

document.addEventListener('click', function(e){
  var bar = e.target.closest ? e.target.closest('.bar[data-open="1"]') : null;
  if(bar) openDoc(bar.getAttribute('data-key'));
});
</script>
</body>
</html>
